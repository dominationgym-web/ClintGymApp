name: Publish website

# The small public website the App Store and Google Play need: privacy policy,
# account deletion and support pages, built from src/lib/privacyPolicy.ts and
# hosted with EAS Hosting at https://consistent-change.expo.app.
on:
  push:
    branches: ["claude/coaching-app-brief-tllivw", "claude/project-thread-wbdtb8"]
    paths:
      - "src/lib/privacyPolicy.ts"
      - "scripts/build-site.mjs"
      - "assets/icon.png"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish website
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the pages
        run: node --experimental-strip-types scripts/build-site.mjs site-dist

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy with EAS Hosting
        run: eas deploy --prod --export-dir site-dist --non-interactive
