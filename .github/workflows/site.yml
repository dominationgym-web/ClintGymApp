name: Publish website

# The small public website the App Store and Google Play need: privacy policy,
# account deletion and support pages, built from src/lib/privacyPolicy.ts and
# hosted with EAS Hosting at https://dailyevolution.co.za (the old address
# https://consistent-change.expo.app still works). The web version of the
# app, for trainers on a laptop, is served from /app.
on:
  push:
    branches: ["claude/coaching-app-brief-tllivw"]
    paths:
      - "src/lib/privacyPolicy.ts"
      - "scripts/build-site.mjs"
      - "assets/icon.png"
      - ".github/workflows/site.yml"
      # The laptop version of the app at /app is rebuilt with every app change.
      - "src/**"
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish website
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # eas reads app.json, which needs the config plugins installed.
      - run: npm ci

      - name: Build the pages
        run: node --experimental-strip-types scripts/build-site.mjs site-dist

      # The same keys the phone builds use (eas.json); the anon key is public.
      - name: Build the laptop version
        run: npx expo export --platform web --output-dir site-dist/app
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://vrasgqqubyurzoknsbgm.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyYXNncXF1Ynl1cnpva25zYmdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MTU2MjEsImV4cCI6MjEwNTA5MTYyMX0.Kqp6vk5JrKN4Hzwz0juXMf-xNdqwHrOYkZRZa4LpdeM

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy with EAS Hosting
        run: eas deploy --prod --export-dir site-dist --non-interactive
